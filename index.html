<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12人3車 沖繩實戰 Check List</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                    },
                    colors: {
                        okinawa: {
                            light: '#e0f2fe',
                            DEFAULT: '#0ea5e9',
                            dark: '#0284c7',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .checkbox-custom {
            appearance: none;
            background-color: #fff;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 1.5em;
            height: 1.5em;
            border: 2px solid #cbd5e1;
            border-radius: 0.35em;
            display: grid;
            place-content: center;
            transition: all 0.3s ease-in-out;
            cursor: pointer;
            flex-shrink: 0;
        }

        .checkbox-custom::before {
            content: "";
            width: 0.85em;
            height: 0.85em;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
            transform: scale(0);
            transform-origin: bottom left;
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em white;
            background-color: white;
        }

        .task-item input:checked {
            background-color: #0ea5e9;
            border-color: #0ea5e9;
        }

        .task-item input:checked::before {
            transform: scale(1);
        }

        .task-item.completed span.task-text {
            text-decoration: line-through;
            color: #94a3b8;
        }

        .task-item.completed {
            background-color: #f8fafc;
            border-color: #e2e8f0;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12 selection:bg-okinawa selection:text-white">

    <!-- 頂部導覽與標題 -->
    <header class="bg-white shadow-sm sticky top-0 z-10 w-full mb-6">
        <div class="max-w-3xl mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl md:text-2xl font-black text-slate-800 tracking-wide">
                    <span class="text-okinawa">12人 3車</span> 沖繩之旅 🚨
                </h1>
                <p class="text-xs md:text-sm text-slate-500 mt-1 font-medium">出發前 7 日 ＆ 每日實戰 Check List</p>
            </div>
            <button onclick="showResetModal('all')" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-2 px-3 rounded-lg transition-colors shadow-sm">
                全部重置
            </button>
        </div>
    </header>

    <!-- 自訂重置確認對話框 -->
    <div id="reset-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 transition-opacity">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl transform transition-transform scale-100">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 rounded-full bg-rose-100 flex items-center justify-center text-rose-500 text-xl">
                    ⚠️
                </div>
                <h3 id="modal-title" class="text-lg font-bold text-slate-800">確認重置清單</h3>
            </div>
            <p id="modal-desc" class="text-slate-600 mb-6 font-medium">確定要清除所有已打勾的紀錄嗎？這個動作無法復原喔。</p>
            <div class="flex justify-end gap-3">
                <button onclick="closeModal()" class="px-4 py-2 rounded-lg bg-slate-100 text-slate-700 hover:bg-slate-200 font-bold transition-colors">
                    取消
                </button>
                <button onclick="confirmReset()" class="px-4 py-2 rounded-lg bg-rose-500 text-white hover:bg-rose-600 font-bold transition-colors shadow-sm shadow-rose-200">
                    確定清除
                </button>
            </div>
        </div>
    </div>

    <main class="max-w-3xl mx-auto px-4 space-y-6" id="checklist-container">
        <!-- 內容由 JavaScript 動態生成以利進度管理 -->
    </main>

    <script>
        // 定義清單資料
        const listData = [
            {
                id: 'pre7days',
                title: '【出發前 7 日確認】',
                icon: '✈️',
                color: 'blue',
                tasks: [
                    "華航航班（CI120 / CI123）全員名單與護照效期（6 個月以上）。",
                    "OTS WS 級休旅車 3 台預約單確認（預約號：1494343 / 1494360 / 1494365）。",
                    "3 車駕駛人：台灣駕照正本 ＋ 日文譯本正本 準備完成。",
                    "本部元氣村海豚預約確認（09:00 餵食 / 11:30 接觸）。",
                    "燒肉本部牧場 名護店 預約確認（Day 3 17:45 入席，預約號：9ASHJD，12 人）。",
                    "查閱 9/25～9/28 當週沖繩最新天氣與颱風動態。",
                    "3 車主駕駛手機實際輸入 MapCode 測試與離線地圖下載。"
                ]
            },
            {
                id: 'daily-morning',
                title: '【每日早晨出發前】（各車長點名）',
                icon: '☀️',
                color: 'orange',
                tasks: [
                    "飯店早餐享用完畢。",
                    "護照、日圓現金、信用卡、上網手機、行動電源、車充線。",
                    "水壺、防曬用品、雨具（傘/輕便雨衣）、薄外套。",
                    "汽座安裝穩固確認、小孩坐姿與安全帶鎖定。",
                    "車鑰匙、飯店房卡保管好。"
                ]
            },
            {
                id: 'daily-night',
                title: '【每日晚間回房前】',
                icon: '🌙',
                color: 'indigo',
                tasks: [
                    "LINE 群組確認明日早餐與集合出發時間、車輛配置。",
                    "手機、行動電源、相機完全充飽電。",
                    "整理車內垃圾與當日採買戰利品。"
                ]
            },
            {
                id: 'day4-return',
                title: '【Day 4 還車返台衝刺】',
                icon: '🚗',
                color: 'rose',
                tasks: [
                    "09:00 雙手機線上確認／購買 DMM 企鵝體驗券（設定 4 張專搶小朋友；若額滿立即啟動備案 B）。",
                    "09:10 司機提早將大行李裝載上車進行空間配置。",
                    "iias Foodway 超市冷藏生鮮最後買，15:30 停止採買並用紙箱裝箱封妥，15:45 準時發車。",
                    "行李封箱前確認：所有行動電源與鋰電池已從大行李箱/紙箱取出放入隨身包。",
                    "加滿油、各車司機保管該車收據並拍照備份、車內物品與垃圾完全清空、拔出 ETC 卡。",
                    "還車時拍下 3 台車外觀與油表存證，出示加油收據，16:15–17:00 完成還車與搭上接駁車。",
                    "機場基地營分流：國際線 3 樓建立基地營顧行李，壯丁至國內線 2 樓買晚餐回基地，確認華航開櫃後立即全團託運。"
                ]
            }
        ];

        // 讀取 LocalStorage 狀態
        let savedState = JSON.parse(localStorage.getItem('okinawaChecklist')) || {};
        let currentResetTarget = 'all';

        // 初始化渲染
        function renderChecklist() {
            const container = document.getElementById('checklist-container');
            container.innerHTML = '';

            listData.forEach((section, sectionIndex) => {
                // 計算進度
                const completedCount = section.tasks.filter((_, taskIndex) => 
                    savedState[`${section.id}-${taskIndex}`]
                ).length;
                const totalCount = section.tasks.length;
                const progressPercent = (completedCount / totalCount) * 100;
                
                // 區塊顏色配置
                const colorMap = {
                    blue: 'bg-blue-500',
                    orange: 'bg-orange-500',
                    indigo: 'bg-indigo-500',
                    rose: 'bg-rose-500'
                };
                const bgClass = colorMap[section.color];

                // 創建區塊 (保留單一區塊重置按鈕)
                const sectionHTML = `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <!-- 區塊標題與進度 -->
                        <div class="p-4 md:p-5 border-b border-slate-100 flex flex-wrap sm:flex-nowrap items-center justify-between gap-3 bg-slate-50">
                            <h2 class="text-base md:text-lg font-bold flex items-center gap-2 text-slate-800">
                                <span>${section.icon}</span> ${section.title}
                            </h2>
                            <div class="flex items-center gap-2">
                                <span class="text-xs md:text-sm font-bold text-slate-500 bg-white px-2.5 py-1 rounded-full shadow-sm border border-slate-100">
                                    <span id="count-${section.id}">${completedCount}</span> / ${totalCount}
                                </span>
                                <button onclick="showResetModal('${section.id}')" title="重置此區塊" class="text-xs bg-white hover:bg-slate-100 text-slate-600 hover:text-slate-800 px-2.5 py-1 rounded-lg border border-slate-200 transition-colors flex items-center gap-1 font-bold shadow-sm">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                                    重置此區
                                </button>
                            </div>
                        </div>
                        
                        <!-- 進度條 -->
                        <div class="w-full bg-slate-100 h-1.5">
                            <div id="progress-${section.id}" class="${bgClass} h-1.5 transition-all duration-500 ease-out" style="width: ${progressPercent}%"></div>
                        </div>

                        <!-- 任務列表 -->
                        <div class="p-3 md:p-4 space-y-3">
                            ${section.tasks.map((task, taskIndex) => {
                                const taskId = `${section.id}-${taskIndex}`;
                                const isChecked = savedState[taskId] ? 'checked' : '';
                                const completedClass = savedState[taskId] ? 'completed' : '';
                                
                                return `
                                <label class="task-item ${completedClass} flex items-start gap-4 p-3 md:p-4 rounded-xl border border-transparent hover:bg-slate-50 hover:border-slate-200 transition-all cursor-pointer shadow-sm bg-white ring-1 ring-slate-100">
                                    <input 
                                        type="checkbox" 
                                        class="checkbox-custom mt-0.5" 
                                        ${isChecked}
                                        onchange="toggleTask('${section.id}', ${taskIndex}, this)"
                                    >
                                    <span class="task-text text-base font-medium leading-relaxed flex-1 select-none transition-colors duration-300">
                                        ${task}
                                    </span>
                                </label>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', sectionHTML);
            });
        }

        // 切換任務狀態
        function toggleTask(sectionId, taskIndex, checkboxElement) {
            const taskId = `${sectionId}-${taskIndex}`;
            const isChecked = checkboxElement.checked;
            
            // 更新狀態與 LocalStorage
            savedState[taskId] = isChecked;
            localStorage.setItem('okinawaChecklist', JSON.stringify(savedState));

            // 更新 UI 樣式 (添加刪除線與淡化)
            const labelElement = checkboxElement.closest('.task-item');
            if (isChecked) {
                labelElement.classList.add('completed');
            } else {
                labelElement.classList.remove('completed');
            }

            // 更新進度條與計數
            updateProgress(sectionId);
        }

        // 更新進度條與數字
        function updateProgress(sectionId) {
            const section = listData.find(s => s.id === sectionId);
            const totalCount = section.tasks.length;
            const completedCount = section.tasks.filter((_, taskIndex) => 
                savedState[`${sectionId}-${taskIndex}`]
            ).length;
            
            const progressPercent = (completedCount / totalCount) * 100;
            
            document.getElementById(`count-${sectionId}`).innerText = completedCount;
            document.getElementById(`progress-${sectionId}`).style.width = `${progressPercent}%`;
        }

        // 顯示重置確認對話框
        function showResetModal(target = 'all') {
            currentResetTarget = target;
            const modalTitle = document.getElementById('modal-title');
            const modalDesc = document.getElementById('modal-desc');

            if (target === 'all') {
                modalTitle.innerText = '確認重置全部清單';
                modalDesc.innerText = '確定要清除所有已打勾的紀錄嗎？這個動作無法復原喔。';
            } else {
                const section = listData.find(s => s.id === target);
                const titleText = section ? section.title : '該區塊';
                modalTitle.innerText = `重置 ${titleText}`;
                modalDesc.innerText = `確定要清除「${titleText}」所有打勾的紀錄嗎？`;
            }

            document.getElementById('reset-modal').classList.remove('hidden');
        }

        // 隱藏對話框
        function closeModal() {
            document.getElementById('reset-modal').classList.add('hidden');
        }

        // 確定重置清單（支援單一區塊或全部）
        function confirmReset() {
            if (currentResetTarget === 'all') {
                savedState = {};
            } else {
                const section = listData.find(s => s.id === currentResetTarget);
                if (section) {
                    section.tasks.forEach((_, taskIndex) => {
                        delete savedState[`${currentResetTarget}-${taskIndex}`];
                    });
                }
            }
            localStorage.setItem('okinawaChecklist', JSON.stringify(savedState));
            renderChecklist();
            closeModal();
        }

        // 網頁載入時執行渲染
        document.addEventListener('DOMContentLoaded', renderChecklist);
    </script>
</body>
</html>
